<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прояв — Центр керування</title>
<link rel="stylesheet" href="tokens.css">
<script src="config.js"></script>
<style>
/* ══ Брендова темна адмінка (tokens.css) ══ */
body{background:var(--ink-darkroom);color:var(--silver-500);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
::selection{background:var(--sepia);color:var(--ink-darkroom)}
*::-webkit-scrollbar{width:9px;height:9px}*::-webkit-scrollbar-thumb{background:var(--paper-15);border-radius:5px}*::-webkit-scrollbar-track{background:transparent}

/* ── Login ── */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:100%;max-width:360px;text-align:center}
.login-mark{width:46px;height:46px;border:1.5px solid var(--paper);border-radius:50%;position:relative;margin:0 auto 20px}
.login-mark::before{content:'';position:absolute;inset:8px;border:1px solid var(--paper-30);border-radius:50%}
.login-mark::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;background:var(--paper);border-radius:50%;transform:translate(-50%,-50%)}
.login-logo{font-family:var(--font-display);font-weight:500;letter-spacing:var(--ls-logo);font-size:24px;color:var(--paper)}
.login-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin:6px 0 30px}

/* ── Inputs ── */
.inp,select,textarea{width:100%;background:var(--paper-08);border:1px solid var(--paper-15);color:var(--paper);border-radius:var(--r-2);padding:11px 14px;font-size:14px;outline:none;transition:border-color .18s}
.inp:focus,select:focus,textarea:focus{border-color:var(--sepia)}
.inp::placeholder{color:var(--paper-30)}
textarea{resize:vertical;min-height:64px}
select option{background:var(--ink-graphite)}
label{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-50);margin-bottom:6px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;border-radius:var(--r-pill);padding:0 20px;height:44px;font-size:14px;font-weight:500;transition:filter .15s,border-color .15s,background .15s}
.btn-primary{background:var(--sepia);color:var(--ink-darkroom)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--paper);border:1.5px solid var(--paper-15)}
.btn-ghost:hover{border-color:var(--paper)}
.btn-danger{background:transparent;color:var(--safelight);border:1px solid rgba(178,58,44,.4)}
.btn-danger:hover{background:rgba(178,58,44,.12)}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn-mono{background:transparent;color:var(--paper);border:1px solid var(--paper-30);border-radius:var(--r-2);height:38px;font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.btn-mono:hover{background:var(--paper-08)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* ── Shell ── */
#app{display:none}
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:230px;flex-shrink:0;border-right:1px solid var(--paper-15);background:rgba(20,18,17,.9);display:flex;flex-direction:column;padding:24px 16px}
.side-brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px;margin-bottom:8px;border-bottom:1px solid var(--paper-15)}
.side-mark{width:32px;height:32px;border:1.5px solid var(--paper);border-radius:50%;position:relative;flex-shrink:0}
.side-mark::before{content:'';position:absolute;inset:6px;border:1px solid var(--paper-30);border-radius:50%}
.side-mark::after{content:'';position:absolute;top:50%;left:50%;width:3px;height:3px;background:var(--paper);border-radius:50%;transform:translate(-50%,-50%)}
.side-name{font-family:var(--font-display);font-weight:500;letter-spacing:.3em;font-size:15px;color:var(--paper);line-height:1}
.side-meta{font-family:var(--font-mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--sepia);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px;flex:1}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:none;cursor:pointer;border-radius:var(--r-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-50);text-align:left;transition:.15s;width:100%}
.nav-btn:hover{color:var(--paper);background:var(--paper-08)}
.nav-btn.active{color:var(--ink-darkroom);background:var(--paper)}
.nav-btn svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-left:auto;font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--sepia)}
.nav-btn.active .nav-badge{color:var(--ink-darkroom)}
.side-foot{padding-top:14px;border-top:1px solid var(--paper-15)}

.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,40px) 80px;max-width:1280px}
.page{display:none}.page.active{display:block;animation:emerge .35s var(--ease-emerge)}
@keyframes emerge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Page head ── */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--paper-15)}
.peyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin-bottom:9px;display:flex;align-items:center;gap:9px}
.peyebrow .ln{width:26px;height:1px;background:var(--sepia)}
.ptitle{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1;letter-spacing:-.015em;color:var(--paper)}
.ptitle em{font-style:italic;color:var(--sepia)}

/* ── Cards / stat ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--paper-08);border:1px solid var(--paper-15);border-radius:var(--r-2);padding:18px}
.card-k{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-50)}
.card-v{font-family:var(--font-display);font-size:30px;line-height:1;color:var(--paper);margin-top:9px}
.card-v .u{font-family:var(--font-body);font-size:14px;color:var(--paper-50);margin-left:3px}
.card-sub{font-size:11px;color:var(--paper-50);margin-top:6px}
.card-v.sepia{color:var(--sepia)}.card-v.green{color:#6bbf8a}.card-v.red{color:var(--safelight)}

/* ── Section head ── */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
.shead h2{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--paper)}
.shead .mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-50)}

/* ── Toolbar / filters ── */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--paper-15);border-radius:var(--r-pill);padding:7px 15px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--paper-50);transition:.15s}
.chip:hover{color:var(--paper);border-color:var(--paper-30)}
.chip.active{background:var(--paper);color:var(--ink-darkroom);border-color:var(--paper)}
.search{flex:1;min-width:180px;max-width:320px}

/* ── Table ── */
.tbl-wrap{border:1px solid var(--paper-15);border-radius:var(--r-2);overflow:hidden;background:var(--paper-08)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-family:var(--font-mono);font-size:9px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-50);border-bottom:1px solid var(--paper-15);white-space:nowrap}
td{padding:13px 16px;font-size:14px;border-bottom:1px solid var(--paper-08);vertical-align:middle;color:var(--silver-500)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--paper-08)}
td b{color:var(--paper);font-weight:500}
.tsub{font-size:12px;color:var(--paper-50)}
.empty{text-align:center;padding:54px 20px;color:var(--paper-50);font-style:italic;font-family:var(--font-display);font-size:18px}

/* ── Badges ── */
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bd::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bd-new{background:rgba(217,211,200,.12);color:var(--silver-400)}.bd-new::before{background:var(--silver-400)}
.bd-uploaded{background:rgba(196,149,108,.16);color:var(--sepia)}.bd-uploaded::before{background:var(--sepia);animation:pulse 1.6s infinite}
.bd-in_progress{background:rgba(196,149,108,.12);color:var(--sepia)}.bd-in_progress::before{background:var(--sepia)}
.bd-sent{background:transparent;color:var(--paper);border:1px solid var(--paper-30)}.bd-sent::before{background:var(--paper)}
.bd-paid{background:rgba(107,191,138,.14);color:#6bbf8a}.bd-paid::before{background:#6bbf8a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.src{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-50)}
.src.photographer{color:var(--sepia)}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--ink-graphite);border:1px solid var(--paper-15);border-radius:var(--r-3);padding:26px;max-width:640px;width:100%;box-shadow:var(--shadow-dark)}
.modal-lg{max-width:820px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
.modal-title{font-family:var(--font-display);font-size:24px;color:var(--paper);line-height:1.1}
.modal-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--paper-30);background:none;color:var(--paper);cursor:pointer;flex-shrink:0;font-size:16px;line-height:1}
.modal-x:hover{background:var(--paper-08)}
.frow{margin-bottom:14px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.factions{display:flex;gap:10px;margin-top:22px}
.factions .btn{flex:1}

/* detail grid */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.ditem{background:var(--paper-08);border-radius:var(--r-2);padding:11px 13px}
.ditem label{margin-bottom:3px}
.ditem span{font-size:14px;color:var(--paper)}

/* status timeline (mini) */
.tline{display:flex;align-items:center;margin:6px 0 18px}
.tstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.tdot{width:11px;height:11px;border-radius:50%;border:1px solid var(--paper-30);background:transparent;z-index:1}
.tstep.done .tdot{background:var(--paper);border-color:var(--paper)}
.tstep.active .tdot{background:var(--sepia);border-color:var(--sepia);box-shadow:0 0 0 4px rgba(196,149,108,.18)}
.tlbl{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-30)}
.tstep.done .tlbl,.tstep.active .tlbl{color:var(--paper-70)}
.tline-bar{position:absolute;top:5px;left:50%;width:100%;height:1px;background:var(--paper-15);z-index:0}
.tstep.done .tline-bar{background:var(--paper-30)}
.tstep:last-child .tline-bar{display:none}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.pthumb{aspect-ratio:1/1.25;border:1px solid var(--paper-15);overflow:hidden;cursor:pointer;background:var(--ink-darkroom);position:relative}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.pthumb:hover img{transform:scale(1.05)}

/* link box */
.linkbox{background:var(--paper-08);border:1px dashed var(--paper-30);border-radius:var(--r-2);padding:12px 14px;margin-top:14px}
.linkurl{font-family:var(--font-mono);font-size:12px;color:var(--sepia);word-break:break-all;margin-bottom:9px}

/* photographers */
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.phcard{background:var(--paper-08);border:1px solid var(--paper-15);border-radius:var(--r-2);padding:16px}
.phname{font-family:var(--font-display);font-size:19px;color:var(--paper)}
.phmeta{font-size:12px;color:var(--paper-50);margin:4px 0 12px}
.phactions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.phactions .btn{flex:1;min-width:80px}

/* goal bar */
.goal{background:var(--paper-08);border:1px solid var(--paper-15);border-radius:var(--r-2);padding:18px;margin-bottom:24px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.goal-bar{height:8px;background:var(--paper-08);border:1px solid var(--paper-15);border-radius:var(--r-pill);overflow:hidden}
.goal-fill{height:100%;background:linear-gradient(90deg,var(--sepia),#d9b48c);border-radius:var(--r-pill);transition:width .6s var(--ease-emerge)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--paper);color:var(--ink-darkroom);padding:12px 22px;border-radius:var(--r-pill);font-size:14px;font-weight:500;z-index:999;transition:transform .25s;pointer-events:none;box-shadow:var(--shadow-dark)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--safelight);color:#fff}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:none;align-items:center;justify-content:center;padding:30px}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:85vh;object-fit:contain}
.lb-x{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--paper-30);background:rgba(0,0,0,.4);color:var(--paper);cursor:pointer;font-size:18px}

.err{color:var(--safelight);font-size:13px;min-height:18px;margin-top:8px}
.hint{font-size:12px;color:var(--paper-50);margin-top:4px}
.warn-row{color:var(--safelight)}

@media(max-width:820px){
  .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;border-right:none;border-top:1px solid var(--paper-15);padding:8px;z-index:90;overflow-x:auto}
  .side-brand,.side-meta,.side-foot,.nav-badge{display:none}
  .nav{flex-direction:row;margin:0;gap:4px}
  .nav-btn{flex-direction:column;gap:4px;font-size:8px;padding:6px 10px;white-space:nowrap}
  .main{padding-bottom:90px}
  .dgrid,.frow2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login">
  <div class="login-card">
    <div class="login-mark"></div>
    <div class="login-logo">ПРОЯВ</div>
    <div class="login-sub">Центр керування</div>
    <input class="inp" id="pwd" type="password" placeholder="Пароль" autofocus style="text-align:center">
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="login()">Увійти</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
<div class="shell">
  <aside class="side">
    <div class="side-brand">
      <span class="side-mark"></span>
      <div><div class="side-name">ПРОЯВ</div><div class="side-meta">Адмінка</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><button class="btn-mono btn-block" onclick="logout()">Вийти</button></div>
  </aside>

  <main class="main" id="main"></main>
</div>
</div>

<!-- modal mount -->
<div class="modal-bg" id="modal"><div class="modal" id="modal-inner"></div></div>
<div class="lb" id="lb" onclick="closeLb()"><button class="lb-x">✕</button><img id="lb-img" src="" alt=""></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const API='', SITE=location.origin;
let TOKEN = sessionStorage.getItem('admin_token');

// ── state ──
const S = { orders:[], stats:{}, photographers:[], expenses:[], expCats:[], inventory:[], lowCount:0, settings:{}, loaded:{} };
let curFilter='all', curOrder=null, searchTimer, editPhId=null;

const PKG = (window.PROYAV&&PROYAV.packages)||{};
const PRODUCT_LABEL = { small:'Маленький набір', medium:'Подвійний набір', large:'Великий набір', baby:'Спогади малюка' };
const STATUS = {
  new:        {label:'Нове',          short:'Нове'},
  uploaded:   {label:'Фото отримано', short:'Фото'},
  in_progress:{label:'В роботі',      short:'Робота'},
  sent:       {label:'Відправлено',   short:'Відправ.'},
  paid:       {label:'Оплачено',      short:'Оплата'},
};
const FLOW = ['new','uploaded','in_progress','sent','paid'];

// ── nav ──
const NAV = [
  ['dashboard','Дашборд', '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="6" height="6"/><rect x="9.5" y="2.5" width="6" height="6"/><rect x="2.5" y="9.5" width="6" height="6"/><rect x="9.5" y="9.5" width="6" height="6"/></svg>'],
  ['orders','Замовлення','<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2.5" width="12" height="13"/><path d="M6 6h6M6 9h6M6 12h4"/></svg>'],
  ['expenses','Витрати',  '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6.5"/><path d="M9 5.5v7M7 10.5c0 1 .9 1.5 2 1.5s2-.5 2-1.5-1-1.3-2-1.5-2-.5-2-1.5.9-1.5 2-1.5 2 .5 2 1.5"/></svg>'],
  ['inventory','Склад',   '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6L9 2.5 15.5 6v6L9 15.5 2.5 12z"/><path d="M2.5 6L9 9.5 15.5 6M9 9.5v6"/></svg>'],
  ['cash','Каса',         '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4.5" width="13" height="9" rx="1"/><circle cx="9" cy="9" r="2"/></svg>'],
  ['photographers','Фотографи','<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="7" r="2.6"/><path d="M4 15c0-2.6 2.2-4 5-4s5 1.4 5 4"/></svg>'],
  ['settings','Налаштування','<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="2.5"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M4 4l1.5 1.5M12.5 12.5L14 14M14 4l-1.5 1.5M5.5 12.5L4 14"/></svg>'],
];
function renderNav(active){
  document.getElementById('nav').innerHTML = NAV.map(([id,label,icon])=>{
    let badge='';
    if(id==='orders'){ const n=S.orders.filter(o=>o.status==='new'||o.status==='uploaded').length; if(n)badge=`<span class="nav-badge">${n}</span>`; }
    if(id==='inventory'&&S.lowCount)badge=`<span class="nav-badge" style="color:var(--safelight)">${S.lowCount}</span>`;
    return `<button class="nav-btn ${id===active?'active':''}" onclick="go('${id}')">${icon}<span>${label}</span>${badge}</button>`;
  }).join('');
}

// ── util ──
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function money(n){return (Math.round(Number(n)||0)).toLocaleString('uk-UA');}
function fmtD(iso){if(!iso)return'—';const d=new Date(iso);return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;}
function fmtDT(iso){if(!iso)return'—';return new Date(iso).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function oid(o){return 'ПРЯ-'+String(o.id||'').replace(/\D/g,'').padStart(6,'0').slice(-6);}
function prodLabel(o){return o.product_type?(PRODUCT_LABEL[o.product_type]||esc(o.product_type)):'Роздрібний друк';}

async function apiFetch(url,opts={}){
  const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${TOKEN}`,...(opts.headers||{})}});
  if(r.status===401){logout();throw new Error('Сесія закінчилась');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Помилка сервера');
  return d;
}

// ── auth ──
async function login(){
  const pwd=document.getElementById('pwd').value.trim();
  if(!pwd)return;
  document.getElementById('login-err').textContent='';
  try{
    const r=await fetch(`${API}/api-admin-login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Невірний пароль');
    TOKEN=d.token; sessionStorage.setItem('admin_token',TOKEN);
    boot();
  }catch(e){document.getElementById('login-err').textContent=e.message;}
}
function logout(){sessionStorage.removeItem('admin_token');location.reload();}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await Promise.all([loadOrders(), loadInventory().catch(()=>{}), loadSettings().catch(()=>{})]);
  go('dashboard');
}
if(TOKEN)boot();

// ── router ──

// ════════ DASHBOARD ════════
let dashPeriod='month';
function periodStart(p){
  const d=new Date();
  if(p==='week'){const w=new Date(d);const day=(w.getDay()+6)%7;w.setDate(w.getDate()-day);w.setHours(0,0,0,0);return w;}
  if(p==='month')return new Date(d.getFullYear(),d.getMonth(),1);
  return new Date(0);
}
function inPeriod(iso,p){if(!iso)return false;return new Date(iso)>=periodStart(p);}

function PAGE_dashboard(){
  const p=dashPeriod;
  const paid=S.orders.filter(o=>o.status==='paid');
  const revenue=paid.filter(o=>inPeriod(o.paid_at||o.created_at,p)).reduce((s,o)=>s+(o.total_amount||0),0);
  const exp=S.expenses.filter(e=>inPeriod(e.date,p)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const profit=revenue-exp;
  const ordersInP=S.orders.filter(o=>inPeriod(o.created_at,p)).length;
  const target=Number(S.settings.monthly_target||0);
  const wTarget=Number(S.settings.weekly_target||0);
  const goalTarget=p==='week'?wTarget:target;
  const pct=goalTarget?Math.min(100,Math.round(revenue/goalTarget*100)):0;

  // funnel
  const fc={}; FLOW.forEach(k=>fc[k]=S.orders.filter(o=>o.status===k).length);
  // channels
  const chPhoto=S.orders.filter(o=>o.source==='photographer').length;
  const chPkg=S.orders.filter(o=>o.source==='package').length;
  const chRetail=S.orders.filter(o=>!o.source||o.source==='retail').length;

  const expLoaded=S.loaded.expenses;
  return `
  <div class="phead">
    <div><div class="peyebrow"><span class="ln"></span>Огляд</div><h1 class="ptitle">Дашборд</h1></div>
    <div class="toolbar" style="margin:0">
      ${['week','month','all'].map(k=>`<button class="chip ${k===p?'active':''}" onclick="dashPeriod='${k}';if(!S.loaded.expenses){loadExpenses().then(()=>go('dashboard'))}else go('dashboard')">${k==='week'?'Тиждень':k==='month'?'Місяць':'Весь час'}</button>`).join('')}
    </div>
  </div>

  ${goalTarget?`<div class="goal">
    <div class="goal-top"><span class="card-k">Ціль ${p==='week'?'тижня':'місяця'} · ${money(goalTarget)}₴</span><span style="font-family:var(--font-display);font-style:italic;font-size:20px;color:var(--sepia)">${pct}%</span></div>
    <div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
    <div class="card-sub">Виручка ${money(revenue)}₴ ${revenue<goalTarget?`· ще ${money(goalTarget-revenue)}₴ до цілі`:'· ціль досягнута 🤍'}</div>
  </div>`:''}

  <div class="cards">
    <div class="card"><div class="card-k">Виручка</div><div class="card-v green">${money(revenue)}<span class="u">₴</span></div><div class="card-sub">оплачені за період</div></div>
    <div class="card"><div class="card-k">Витрати</div><div class="card-v ${exp?'red':''}">${expLoaded?money(exp):'—'}<span class="u">₴</span></div><div class="card-sub">${expLoaded?'за період':'натисніть «Витрати»'}</div></div>
    <div class="card"><div class="card-k">Прибуток</div><div class="card-v ${profit>=0?'sepia':'red'}">${expLoaded?money(profit):'—'}<span class="u">₴</span></div><div class="card-sub">виручка − витрати</div></div>
    <div class="card"><div class="card-k">Замовлень</div><div class="card-v">${ordersInP}</div><div class="card-sub">створено за період</div></div>
  </div>

  <div class="shead"><h2>Лійка замовлень <span class="mono">всі</span></h2></div>
  <div class="cards" style="grid-template-columns:repeat(5,1fr)">
    ${FLOW.map(k=>`<div class="card" style="cursor:pointer" onclick="curFilter='${k}';go('orders')"><div class="card-k">${STATUS[k].label}</div><div class="card-v" style="font-size:26px">${fc[k]}</div></div>`).join('')}
  </div>

  <div class="shead"><h2>Звідки замовлення</h2></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="card"><div class="card-k">Фотограф</div><div class="card-v sepia" style="font-size:26px">${chPhoto}</div></div>
    <div class="card"><div class="card-k">Пакет (сайт)</div><div class="card-v" style="font-size:26px">${chPkg}</div></div>
    <div class="card"><div class="card-k">Роздріб</div><div class="card-v" style="font-size:26px">${chRetail}</div></div>
  </div>

  ${S.lowCount?`<div class="goal" style="border-color:rgba(178,58,44,.4);margin-top:24px"><div class="goal-top"><span class="card-k" style="color:var(--safelight)">⚠ Закінчується на складі</span><button class="btn btn-mono btn-sm" onclick="go('inventory')">Переглянути</button></div><div class="card-sub">${S.lowCount} позицій нижче порогу</div></div>`:''}
  `;
}

function expRows(){
  if(!S.expenses.length)return `<tr><td colspan="6" class="empty">Витрат ще немає</td></tr>`;
  return S.expenses.map(e=>`<tr>
    <td class="tsub">${fmtD(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.descr||'—')}</td>

async function addExpense(){
  const amount=Number(document.getElementById('e-amount').value);
  if(!amount||amount<0)return toast('Введіть суму','err');
  try{
    const r=await apiFetch(`${API}/api-expenses`,{method:'POST',body:JSON.stringify({
      date:document.getElementById('e-date').value,
      amount, category:document.getElementById('e-cat').value,
      payment:document.getElementById('e-pay').value,
      descr:document.getElementById('e-descr').value.trim(),
    })});
    S.expenses.unshift(r.expense);
    document.getElementById('e-amount').value=''; document.getElementById('e-descr').value='';
    document.getElementById('etbody').innerHTML=expRows();
    toast('Витрату додано');
  }catch(e){toast(e.message,'err');}
}
async function delExpense(id){
  if(!confirm('Видалити витрату?'))return;
  try{await apiFetch(`${API}/api-expenses?id=${id}`,{method:'DELETE'});S.expenses=S.expenses.filter(e=>e.id!==id);document.getElementById('etbody').innerHTML=expRows();toast('Видалено');}catch(e){toast(e.message,'err');}
}

  <button class="btn btn-primary btn-sm" onclick="openStockItem()">+ Позиція</button></div>
  <div class="tbl-wrap"><div class="tbl-scroll"><table>
    <thead><tr><th>Позиція</th><th>Залишок</th><th>Поріг</th><th>Рух</th><th></th></tr></thead>
    <tbody id="itbody">${invRows()}</tbody>
  </table></div></div>`;
}
function invRows(){
  if(!S.inventory.length)return `<tr><td colspan="5" class="empty">Склад порожній</td></tr>`;
  return S.inventory.map(i=>`<tr class="${i.low?'warn-row':''}">
    <td><b>${esc(i.name)}</b>${i.low?' <span class="src" style="color:var(--safelight)">· замовити</span>':''}${i.note?`<div class="tsub">${esc(i.note)}</div>`:''}</td>
    <td><b style="font-size:16px">${i.qty}</b> <span class="tsub">${esc(i.unit||'шт')}</span></td>
    <td class="tsub">${i.min_qty}</td>
    <td><button class="btn-mono btn-sm" onclick="adjustStock(${i.id},1)">+</button> <button class="btn-mono btn-sm" onclick="adjustStock(${i.id},-1)">−</button> <button class="btn-mono btn-sm" onclick="adjustStockN(${i.id})">±N</button></td>
    <td><button class="btn-danger btn-sm" style="border-radius:var(--r-2)" onclick="delStock(${i.id})">✕</button></td>
  </tr>`).join('');
}
async function adjustStock(id,delta){
  try{const r=await apiFetch(`${API}/api-inventory`,{method:'POST',body:JSON.stringify({action:'adjust',item_id:id,delta})});
    const it=S.inventory.find(i=>i.id===id); if(it){it.qty=r.qty;it.low=Number(it.qty)<=Number(it.min_qty);}
    S.lowCount=S.inventory.filter(i=>i.low).length; document.getElementById('itbody').innerHTML=invRows(); renderNav('inventory');
  }catch(e){toast(e.message,'err');}
}
function adjustStockN(id){const v=prompt('Зміна залишку (напр. 20 або -5):');if(v===null)return;const n=Number(v);if(!n)return;adjustStock(id,n);}
function openStockItem(){
  modal(`<div class="modal-head"><div class="modal-title">Нова позиція складу</div><button class="modal-x" onclick="closeModal()">✕</button></div>
  <div class="frow"><label>Назва *</label><input class="inp" id="s-name" placeholder="Оксамитові конверти latte"></div>
  <div class="frow2"><div class="frow"><label>Одиниця</label><input class="inp" id="s-unit" value="шт"></div><div class="frow"><label>Залишок</label><input class="inp" id="s-qty" type="number" value="0"></div></div>
  <div class="frow2"><div class="frow"><label>Поріг «замовити»</label><input class="inp" id="s-min" type="number" value="5"></div><div class="frow"><label>Нотатка</label><input class="inp" id="s-note"></div></div>
  <div class="factions"><button class="btn btn-ghost" onclick="closeModal()">Закрити</button><button class="btn btn-primary" onclick="saveStockItem()">Додати</button></div>`);
}
async function saveStockItem(){
  const name=document.getElementById('s-name').value.trim(); if(!name)return toast('Введіть назву','err');
  try{const r=await apiFetch(`${API}/api-inventory`,{method:'POST',body:JSON.stringify({
    name, unit:document.getElementById('s-unit').value.trim()||'шт',
    qty:Number(document.getElementById('s-qty').value)||0, min_qty:Number(document.getElementById('s-min').value)||0,
    note:document.getElementById('s-note').value.trim(),
  })});
  S.inventory.push({...r.item,low:Number(r.item.qty)<=Number(r.item.min_qty)});
  S.inventory.sort((a,b)=>a.name.localeCompare(b.name)); S.lowCount=S.inventory.filter(i=>i.low).length;
  closeModal(); go('inventory'); toast('Позицію додано');
  }catch(e){toast(e.message,'err');}
}
async function delStock(id){if(!confirm('Видалити позицію?'))return;try{await apiFetch(`${API}/api-inventory?id=${id}`,{method:'DELETE'});S.inventory=S.inventory.filter(i=>i.id!==id);S.lowCount=S.inventory.filter(i=>i.low).length;document.getElementById('itbody').innerHTML=invRows();renderNav('inventory');}catch(e){toast(e.message,'err');}}

// ════════ CASH ════════
function PAGE_cash(){
  const expLoaded=S.loaded.expenses;
  if(!expLoaded){loadExpenses().then(()=>go('cash'));}
  const openCash=Number(S.settings.opening_cash||0), openCard=Number(S.settings.opening_card||0);
  const income=S.orders.filter(o=>o.status==='paid').reduce((s,o)=>s+(o.total_amount||0),0);
  const expCash=S.expenses.filter(e=>e.payment==='Готівка').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const expCard=S.expenses.filter(e=>e.payment==='Картка').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const expTotal=expCash+expCard;
  const expected=openCash+openCard+income-expTotal;
  return `
  <div class="phead"><div><div class="peyebrow"><span class="ln"></span>Гроші</div><h1 class="ptitle">Каса</h1></div></div>
  <div class="cards">
    <div class="card"><div class="card-k">Дохід (оплачено)</div><div class="card-v green">${money(income)}<span class="u">₴</span></div></div>
    <div class="card"><div class="card-k">Витрати всього</div><div class="card-v ${expTotal?'red':''}">${expLoaded?money(expTotal):'—'}<span class="u">₴</span></div></div>
    <div class="card"><div class="card-k">Очікувано на руках</div><div class="card-v sepia">${expLoaded?money(expected):'—'}<span class="u">₴</span></div><div class="card-sub">старт + дохід − витрати</div></div>
  </div>
  <div class="shead"><h2>Стартові залишки</h2></div>
  <div class="card">
    <div class="frow2"><div class="frow"><label>Готівка на старті</label><input class="inp" id="ca-cash" type="number" value="${openCash}"></div><div class="frow"><label>Картка на старті</label><input class="inp" id="ca-card" type="number" value="${openCard}"></div></div>
    <button class="btn btn-primary" onclick="saveOpening()">Зберегти залишки</button>
    <div class="hint" style="margin-top:10px">Витрати готівкою: ${money(expCash)}₴ · карткою: ${money(expCard)}₴</div>
  </div>`;
}
async function saveOpening(){
  try{await apiFetch(`${API}/api-settings`,{method:'PUT',body:JSON.stringify({opening_cash:document.getElementById('ca-cash').value||'0',opening_card:document.getElementById('ca-card').value||'0'})});
    S.settings.opening_cash=document.getElementById('ca-cash').value; S.settings.opening_card=document.getElementById('ca-card').value; toast('Збережено');
  }catch(e){toast(e.message,'err');}
}

// ════════ PHOTOGRAPHERS ════════
function PAGE_photographers(){
  if(!S.loaded.photographers)return `<div class="phead"><div><h1 class="ptitle">Фотографи</h1></div></div><p class="hint">Завантажуємо…</p>`;
  return `
  <div class="phead"><div><div class="peyebrow"><span class="ln"></span>${S.photographers.length} партнерів</div><h1 class="ptitle">Фотографи</h1></div>
  <button class="btn btn-primary btn-sm" onclick="openPh()">+ Додати фотографа</button></div>
  <div class="phgrid">${S.photographers.length?S.photographers.map(p=>`
    <div class="phcard">
      <div class="phname">${esc(p.name)} ${p.active?'':'<span class="src" style="color:var(--safelight)">неактивний</span>'}</div>
      <div class="phmeta">${esc(p.city||'—')} · ${esc(p.email)}<br>${p.commission_pct}% комісія · ${p.order_count||0} замовлень</div>
      <div class="phactions">
        <button class="btn btn-mono btn-sm" onclick="openPh('${p.id}')">Редагувати</button>
        <button class="btn btn-mono btn-sm" onclick="resetPh('${p.id}')">Пароль</button>
        <button class="btn btn-danger btn-sm" onclick="togglePh('${p.id}',${!p.active})">${p.active?'Вимкнути':'Увімкнути'}</button>
      </div>
    </div>`).join(''):'<div class="empty" style="grid-column:1/-1">Фотографів ще немає</div>'}</div>`;
}
function openPh(id){
  editPhId=id||null;
  const p=id?S.photographers.find(x=>x.id===id):{};
  modal(`<div class="modal-head"><div class="modal-title">${id?'Редагувати':'Додати'} фотографа</div><button class="modal-x" onclick="closeModal()">✕</button></div>
  <div class="frow"><label>Ім'я *</label><input class="inp" id="p-name" value="${esc(p.name||'')}"></div>
  <div class="frow"><label>Email *</label><input class="inp" id="p-email" type="email" value="${esc(p.email||'')}" ${id?'disabled':''}></div>
  <div class="frow2"><div class="frow"><label>Телефон</label><input class="inp" id="p-phone" value="${esc(p.phone||'')}"></div><div class="frow"><label>Місто</label><input class="inp" id="p-city" value="${esc(p.city||'')}"></div></div>
  <div class="frow"><label>Комісія (%)</label><input class="inp" id="p-comm" type="number" value="${p.commission_pct||12}" min="0" max="50"></div>
  <div class="linkbox" id="p-creds" style="display:none"><div class="card-k" style="margin-bottom:6px">Тимчасовий пароль (збережіть!)</div><div class="linkurl" id="p-pwd" style="font-size:16px;color:var(--paper)"></div><button class="btn-mono btn-sm" id="p-copy">Скопіювати доступ</button></div>
  <div class="factions"><button class="btn btn-ghost" onclick="closeModal()">Закрити</button><button class="btn btn-primary" id="p-save" onclick="savePh()">${id?'Зберегти':'Додати і отримати пароль'}</button></div>`);
}
async function savePh(){
  const name=document.getElementById('p-name').value.trim(); if(!name)return toast('Введіть ім\'я','err');
  try{
    if(editPhId){
      const r=await apiFetch(`${API}/api-photographers`,{method:'PUT',body:JSON.stringify({id:editPhId,name,phone:document.getElementById('p-phone').value.trim(),city:document.getElementById('p-city').value.trim(),commission_pct:parseInt(document.getElementById('p-comm').value)||12})});
      const i=S.photographers.findIndex(p=>p.id===editPhId); if(i>=0)S.photographers[i]={...S.photographers[i],...r.photographer};
      closeModal(); go('photographers'); toast('Збережено');
    }else{
      const email=document.getElementById('p-email').value.trim(); if(!email)return toast('Введіть email','err');
      const r=await apiFetch(`${API}/api-photographers`,{method:'POST',body:JSON.stringify({name,email,phone:document.getElementById('p-phone').value.trim(),city:document.getElementById('p-city').value.trim(),commission_pct:parseInt(document.getElementById('p-comm').value)||12})});
      S.photographers.unshift({...r.photographer,order_count:0});
      document.getElementById('p-pwd').textContent=r.temp_password;
      document.getElementById('p-creds').style.display='block';
      document.getElementById('p-copy').onclick=()=>copyTxt(`Email: ${email}\nПароль: ${r.temp_password}\nКабінет: ${SITE}/partner`,document.getElementById('p-copy'));
      document.getElementById('p-save').textContent='Готово'; document.getElementById('p-save').onclick=()=>{closeModal();go('photographers');};
      toast('Фотографа додано');
    }
  }catch(e){toast(e.message,'err');}
}
async function resetPh(id){if(!confirm('Скинути пароль фотографу?'))return;try{const r=await apiFetch(`${API}/api-photographers`,{method:'PUT',body:JSON.stringify({id,reset_password:true})});alert(`Новий тимчасовий пароль:\n\n${r.temp_password}\n\nЗбережіть і надішліть фотографу.`);}catch(e){toast(e.message,'err');}}
async function togglePh(id,active){try{await apiFetch(`${API}/api-photographers`,{method:'PUT',body:JSON.stringify({id,active})});const p=S.photographers.find(x=>x.id===id);if(p)p.active=active;go('photographers');}catch(e){toast(e.message,'err');}}

// ════════ SETTINGS ════════
function PAGE_settings(){
  const s=S.settings;
  const prices=Object.values(PKG).map(p=>`<div class="ditem"><label>${esc(p.short)}</label><span>${p.price}₴ · ${p.photos}${p.cap?'–'+p.cap:''} фото</span></div>`).join('');
  return `
  <div class="phead"><div><div class="peyebrow"><span class="ln"></span>Контроль</div><h1 class="ptitle">Налаштування</h1></div></div>
  <div class="shead"><h2>Цілі та фінмодель</h2></div>
  <div class="card">
    <div class="frow2"><div class="frow"><label>Ціль на місяць (₴)</label><input class="inp" id="set-month" type="number" value="${esc(s.monthly_target||'45000')}"></div><div class="frow"><label>Ціль на тиждень (₴)</label><input class="inp" id="set-week" type="number" value="${esc(s.weekly_target||'11000')}"></div></div>
    <div class="frow2"><div class="frow"><label>Постійні витрати/міс (₴)</label><input class="inp" id="set-fixed" type="number" value="${esc(s.fixed_costs||'2500')}"></div><div class="frow"><label>Комісія за замовч. (%)</label><input class="inp" id="set-comm" type="number" value="${esc(s.commission_pct||'12')}"></div></div>
    <button class="btn btn-primary" onclick="saveSettings()">Зберегти налаштування</button>
  </div>
  <div class="shead"><h2>Ціни наборів <span class="mono">з config.js</span></h2></div>
  <div class="dgrid">${prices||'<span class="hint">config.js не завантажено</span>'}</div>
  <div class="hint">Ціни — єдине джерело правди в <code>config.js</code> (+ дзеркало в <code>functions/_utils.js</code>). Редагуються у коді, не тут.</div>
  <div class="shead"><h2>Експорт</h2></div>
  <div class="toolbar"><button class="btn btn-mono" onclick="exportCSV('orders')">Замовлення → CSV</button><button class="btn btn-mono" onclick="exportCSV('expenses')">Витрати → CSV</button></div>
  `;
}
async function saveSettings(){
  try{await apiFetch(`${API}/api-settings`,{method:'PUT',body:JSON.stringify({
    monthly_target:document.getElementById('set-month').value||'0',
    weekly_target:document.getElementById('set-week').value||'0',
    fixed_costs:document.getElementById('set-fixed').value||'0',
    commission_pct:document.getElementById('set-comm').value||'12',
  })});
  Object.assign(S.settings,{monthly_target:document.getElementById('set-month').value,weekly_target:document.getElementById('set-week').value,fixed_costs:document.getElementById('set-fixed').value,commission_pct:document.getElementById('set-comm').value});
  toast('Збережено');
  }catch(e){toast(e.message,'err');}
}
function exportCSV(kind){
  let rows=[], name=kind;
  if(kind==='orders'){
    rows.push(['ID','Токен','Клієнт','Телефон','Продукт','Статус','Джерело','Сума','ТТН','Створено','Оплачено']);
    S.orders.forEach(o=>rows.push([oid(o),o.token,o.client_name,o.client_phone,prodLabel(o),STATUS[o.status]?.label||o.status,o.source||'retail',o.total_amount||'',o.ttn||'',fmtD(o.created_at),o.paid_at?fmtD(o.paid_at):'']));
  }else{
    if(!S.loaded.expenses)return toast('Спершу відкрийте «Витрати»','err');
    rows.push(['Дата','Категорія','Опис','Оплата','Сума']);
    S.expenses.forEach(e=>rows.push([fmtD(e.date),e.category,e.descr||'',e.payment||'',e.amount]));
  }
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`proyav-${name}-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

// ── pages map (called by go) ──
const PAGES={dashboard:PAGE_dashboard,orders:()=>{const h=PAGE_orders();setTimeout(renderOrdersTable,0);return h;},expenses:PAGE_expenses,inventory:PAGE_inventory,cash:PAGE_cash,photographers:PAGE_photographers,settings:PAGE_settings};

// ── modal / toast / lightbox ──
function modal(html,cls){const inner=document.getElementById('modal-inner');inner.className='modal '+(cls||'');inner.innerHTML=html;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');curOrder=null;editPhId=null;}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function openLb(src){document.getElementById('lb-img').src=src;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}
let toastTimer;
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(type==='err'?' err':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function copyTxt(t,btn){navigator.clipboard?.writeText(t);if(btn){const o=btn.textContent;btn.textContent='Скопійовано ✓';setTimeout(()=>btn.textContent=o,1500);}}
</script>
</body>
</html>
