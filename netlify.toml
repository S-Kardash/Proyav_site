[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/partner"
  to   = "/partner.html"
  status = 200

[[redirects]]
  from = "/order"
  to   = "/order.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
